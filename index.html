<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiwi Vocab — BUA</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f3ef;
  color:#171717;
}

main{
  max-width:650px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:24px;
  margin-top:18px;
}

h1{
  font-size:38px;
  margin:0 0 8px;
}

.sub{
  color:#666;
  font-size:18px;
  margin-bottom:22px;
}

label{
  display:block;
  font-weight:bold;
  margin:16px 0 7px;
}

input{
  width:100%;
  padding:14px;
  font-size:19px;
  border:1px solid #aaa;
  border-radius:12px;
}

button,a{
  display:block;
  width:100%;
  padding:17px;
  margin-top:16px;
  border:0;
  border-radius:14px;
  background:#171717;
  color:#fff;
  font-size:18px;
  font-weight:bold;
  text-align:center;
  text-decoration:none;
}

video{
  width:100%;
  margin-top:16px;
  border-radius:16px;
  background:#000;
}

.hidden{
  display:none;
}

.status{
  padding:12px;
  margin-top:14px;
  border-radius:12px;
  background:#eee;
}

.word{
  font-size:42px;
  font-weight:bold;
  text-align:center;
  margin:28px 0 15px;
}

.timer{
  font-size:60px;
  font-weight:bold;
  text-align:center;
}

.center{
  text-align:center;
  line-height:1.6;
}
</style>
</head>

<body>

<main>

<!-- SETUP -->

<section id="setup" class="card">

<h1>🥝 Kiwi Vocab</h1>

<div class="sub">
BUA Vocabulary Speaking Assessment
</div>

<label>Student ID</label>
<input id="studentID">

<label>English Name</label>
<input id="studentName">

<button onclick="testMedia()">
TEST CAMERA &amp; MICROPHONE
</button>

<div id="mediaStatus" class="status">
Enter your details and test your camera and microphone.
</div>

<video
  id="setupVideo"
  class="hidden"
  autoplay
  muted
  playsinline>
</video>

<button
  id="beginBtn"
  class="hidden"
  onclick="beginTest()">
BEGIN TEST
</button>

</section>


<!-- TEST -->

<section id="test" class="card hidden">

<div id="progress" class="center"></div>

<video
  id="testVideo"
  autoplay
  muted
  playsinline>
</video>

<div id="phase" class="center">
GET READY
</div>

<div id="word" class="word"></div>

<div id="timer" class="timer"></div>

<div class="center">
Say the word.<br>
Explain its meaning in English.<br>
Give an original example sentence.
</div>

</section>


<!-- COMPLETE -->

<section id="done" class="card hidden">

<h1>Good job! 🥝</h1>
