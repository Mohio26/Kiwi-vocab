<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiwi Vocab — BUA M1</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f3ef;color:#171717}


<script>window.addEventListener("DOMContentLoaded",()=>{alert("🥝 Kiwi Vocab JavaScript is working!");});</script>
  
main{max-width:650px;margin:auto;padding:18px}
.card{background:#fff;border-radius:22px;padding:24px;margin-top:18px}
h1{font-size:38px;margin:0 0 8px}
.sub{font-size:18px;color:#666;margin-bottom:22px}
label{display:block;font-size:18px;font-weight:bold;margin:16px 0 7px}
input{width:100%;padding:14px;font-size:19px;border:1px solid #aaa;border-radius:12px}

button,a.save{
display:block;width:100%;padding:17px;margin-top:16px;border:0;
border-radius:14px;background:#171717;color:#fff;font-size:19px;
font-weight:bold;text-align:center;text-decoration:none
}

video{
width:100%;max-height:44vh;object-fit:cover;border-radius:16px;
background:#000;margin-top:14px
}

.word{text-align:center;font-size:42px;font-weight:bold;margin:24px 0 12px}
.timer{text-align:center;font-size:64px;font-weight:bold;margin:8px}
.status{text-align:center;font-size:19px;margin:12px}
.instructions{text-align:center;font-size:18px;line-height:1.55}
.message{margin-top:16px;padding:13px;border-radius:12px;background:#eee}
.good{background:#e5f4e8}
.bad{background:#ffe4e4}
.hidden{display:none!important}

.micBox{
margin-top:16px;
padding:16px;
background:#f2f3ef;
border-radius:14px
}

.micTitle{
font-size:17px;
font-weight:bold;
margin-bottom:10px
}

.meter{
width:100%;
height:24px;
background:#ccc;
border-radius:12px;
overflow:hidden
}

#micLevel{
width:0%;
height:100%;
background:#222;
transition:width .08s linear
}

.micText{
text-align:center;
margin-top:8px;
font-size:15px;
color:#555
}
</style>
</head>

<body>
<main>

<section id="setup" class="card">

<h1>🥝 Kiwi Vocab</h1>
<div class="sub">BUA Vocabulary Speaking Assessment — M1</div>

<label for="studentID">Student ID</label>
<input id="studentID" type="text">

<label for="studentName">English Name</label>
<input id="studentName" type="text">

<button id="testButton">TEST CAMERA &amp; MICROPHONE</button>

<div id="message" class="message">
Enter your details, then test your camera and microphone.
</div>

<div id="equipmentTest" class="hidden">

<video id="setupVideo" autoplay muted playsinline></video>

<div class="micBox">
<div class="micTitle">🎤 Microphone Test</div>

<div class="meter">
<div id="micLevel"></div>
</div>

<div id="micText" class="micText">
Speak normally. The bar should move when you talk.
</div>
</div>

<button id="startButton">
BEGIN ASSESSMENT
</button>

</div>

</section>


<section id="assessment" class="card hidden">

<div id="progress" class="status"></div>

<video id="assessmentVideo" autoplay muted playsinline></video>

<div id="phase" class="status"></div>

<div id="word" class="word"></div>

<div id="timer" class="timer"></div>

<div class="instructions">
Say the word.<br>
Explain its meaning in English.<br>
Give an original example sentence.
</div>

</
