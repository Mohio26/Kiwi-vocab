<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kiwi Vocab</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f4f0;
  font-family:Arial,sans-serif;
  color:#171717;
}

main{
  max-width:600px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:24px;
  border-radius:20px;
  margin-top:20px;
}

h1{
  margin:0 0 5px;
  font-size:38px;
}

.subtitle{
  color:#666;
  margin-bottom:25px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:18px;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:15px;
  font-size:18px;
  border:1px solid #aaa;
  border-radius:10px;
}

button{
  width:100%;
  padding:17px;
  margin-top:20px;
  border:0;
  border-radius:12px;
  background:#171717;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  background:#444;
}

#status{
  margin-top:15px;
  padding:12px;
  background:#eeeeee;
  border-radius:10px;
  line-height:1.4;
}

#cameraBox{
  display:none;
  margin-top:18px;
}

#camera{
  display:block;
  width:100%;
  max-height:300px;
  object-fit:cover;
  background:black;
  border-radius:15px;
}

.ready{
  background:#e5f5e7 !important;
}

.error{
  background:#ffe2e2 !important;
}

</style>
</head>


<body>

<main>

<div class="card">

<h1>🥝 Kiwi Vocab</h1>

<div class="subtitle">
BUA

  </div>

<label>Student ID</label>
<input id="studentID" type="text" placeholder="Enter student ID">

<label>English Name</label>
<input id="studentName" type="text" placeholder="Enter English name">

<button type="button" onclick="testMedia()">
TEST CAMERA &amp; MICROPHONE
</button>

<div id="status" class="status">
Enter your details, then press the test button.
</div>

<div id="cameraBox">

<video id="camera" autoplay muted playsinline></video>

<div style="margin-top:14px;font-weight:bold">
🎤 Microphone
</div>

<div style="height:24px;background:#ddd;border-radius:12px;overflow:hidden;margin-top:8px">
<div id="micLevel"
style="height:100%;width:0%;background:#171717;transition:width .08s">
</div>
</div>

<div id="micText" style="margin-top:7px">
Speak normally — the bar should move.
</div>

<button
id="startBtn"
type="button"
style="display:none"
onclick="startTest()">
START TEST
</button>

</div>

</div>
</main>
