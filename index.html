* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f3ef;
    color: #171717;

.container {
    max-width: 650px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;

    padding: 26px;

}

h1 {

.subtitle {

    color: white;

    text-align: center;
    text-decoration: none;
}

button:disabled {
    background: #aaa;
    color: #eee;
    cursor: not-allowed;
}

.secondary {
    background: #555;
}

.nextButton {
    font-size: 23px;

}

    background: black;
    margin-top: 15px;
}

.status {
    text-align: center;
    font-size: 21px;
    margin: 15px;
}

.instructions {

    font-size: 18px;
